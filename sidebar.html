<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidebar.css">
</head>

<body>
  <div class="container">
    <div class="editor-pane">
      <div class="toolbar">
        <div class="toolbar-row utilities-row">
          <div class="group header-group">
            <button id="menu-btn" class="icon-btn" title="Menu">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <div id="dropdown-menu" class="dropdown-menu hidden">
              <input id="note-search" class="note-search" type="search" placeholder="Search notes" aria-label="Search note titles, content, and folders">
              <div class="folder-list-header">
                <span>Folders</span>
                <button id="new-folder-btn" class="new-folder-btn" type="button" title="Create folder">
                  <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M8 3v10M3 8h10"></path>
                  </svg>
                  <span>New Folder</span>
                </button>
              </div>
              <div class="dropdown-items" id="dropdown-items"></div>
              <div class="dropdown-divider"></div>
              <button id="add-btn" class="dropdown-item add-note-btn">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>New Note</span>
              </button>
            </div>
          </div>
          <div class="group title-group">
            <span id="note-title-text" class="note-title-text">Untitled Note</span>
            <button id="favorite-btn" class="icon-btn" title="Favorite note" aria-label="Favorite note">
              <svg class="star-outline" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
              <svg class="star-filled" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>
            <button id="rename-btn" class="icon-btn" title="Rename Note">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </button>
          </div>
          <div class="group utilities">
            <button id="theme-btn" title="Toggle Light/Dark Theme" class="icon-btn">
              <svg class="sun-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg class="moon-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
            <button id="export-btn" title="Export notes to HTML file" class="icon-btn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </button>
            <button id="clear-btn" class="icon-btn danger" title="Delete current note">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="toolbar-row editor-row">
          <div class="format-dropdown-group">
            <button id="text-style-btn" class="format-btn format-select-btn" type="button" title="Text style" aria-label="Text style" aria-haspopup="true" aria-expanded="false">
              <span id="text-style-label">Normal</span>
              <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M3 6l5 5 5-5"></path>
              </svg>
            </button>
            <div id="text-style-menu" class="dropdown-menu format-dropdown-menu hidden" role="menu">
              <button id="p-btn" class="dropdown-item format-item active" type="button" role="menuitem">Normal Text</button>
              <button id="h1-btn" class="dropdown-item format-item" type="button" role="menuitem">Heading 1</button>
              <button id="h2-btn" class="dropdown-item format-item" type="button" role="menuitem">Heading 2</button>
            </div>
          </div>
          <div class="divider"></div>
          <div class="group">
            <button id="bold-btn" class="format-btn" title="Bold" type="button">B</button>
            <button id="italic-btn" class="format-btn" title="Italic" type="button">I</button>
          </div>
          <div class="divider"></div>
          <div class="format-dropdown-group">
            <button id="list-picker-btn" class="format-btn format-select-btn" type="button" title="Lists" aria-label="Lists" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor">
                <circle cx="3" cy="4" r="1"/><circle cx="3" cy="8" r="1"/><circle cx="3" cy="12" r="1"/>
                <path d="M6 4h8M6 8h8M6 12h8"/>
              </svg>
              <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M3 6l5 5 5-5"></path>
              </svg>
            </button>
            <div id="list-picker-menu" class="dropdown-menu format-dropdown-menu hidden" role="menu">
              <button id="bullet-btn" class="dropdown-item format-item" type="button" role="menuitem" title="Toggle bullet list" aria-label="Toggle bullet list">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"><circle cx="3" cy="4" r="1"/><circle cx="3" cy="8" r="1"/><circle cx="3" cy="8" r="1"/><path d="M6 4h8M6 8h8M6 12h8"/></svg>
                <span>Bullet List</span>
              </button>
              <button id="todo-btn" class="dropdown-item format-item" type="button" role="menuitem" title="Toggle checklist" aria-label="Toggle checklist">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="m4 8 3 3 5-6"/></svg>
                <span>Checklist</span>
              </button>
            </div>
          </div>
          <div class="divider"></div>
          <div class="format-dropdown-group">
            <button id="more-format-btn" class="format-btn" type="button" title="More formatting" aria-label="More formatting" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="3" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="13" cy="8" r="1" fill="currentColor"/>
              </svg>
            </button>
            <div id="more-format-menu" class="dropdown-menu format-dropdown-menu hidden" role="menu">
              <button id="underline-btn" class="dropdown-item format-item" type="button" role="menuitem" title="Underline">
                <span class="format-item-icon underline-icon">U</span>
                <span>Underline</span>
              </button>
              <button id="strike-btn" class="dropdown-item format-item" type="button" role="menuitem" title="Strikethrough">
                <span class="format-item-icon strike-icon">S</span>
                <span>Strikethrough</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div id="note-area" contenteditable="true" placeholder="Type your notes here..."></div>
      <button id="image-resize-handle" class="image-resize-handle hidden" type="button" title="Drag to resize image" aria-label="Drag to resize image">
        <svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 10 10 4M7 10l3-3M10 10V9"></path>
        </svg>
      </button>
    </div>
    <div id="status-bar">Saved</div>
  </div>
  <div id="delete-confirmation" class="delete-confirmation hidden" role="alertdialog" aria-modal="true" aria-labelledby="delete-confirm-title">
    <div class="delete-confirm-card">
      <div id="delete-confirm-title" class="delete-confirm-title">Delete item?</div>
      <div id="delete-confirm-message" class="delete-confirm-message"></div>
      <input id="action-dialog-input" class="inline-name-input hidden" type="text">
      <div class="delete-confirm-actions">
        <button id="delete-cancel-btn" type="button">Cancel</button>
        <button id="delete-confirm-btn" class="danger" type="button">Delete</button>
      </div>
    </div>
  </div>
  <script type="module" src="sidebar.js"></script>
</body>

</html>
